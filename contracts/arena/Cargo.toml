[package]
name = "pac-arena"
version = "0.1.0"
edition = "2021"
description = "Public Agent Coin (PAC) — on-chain memecoin arena on NEAR testnet. Every AI agent is a public wallet; the token rules react to what those transparent wallets do."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5"
near-contract-standards = "5.5"
# near-sdk's own "abi" feature cannot be enabled for wasm32 (its schemars
# dep is host-only), so enable the abi feature on near-account-id directly:
# that gives AccountId its JsonSchema impl on wasm32 via feature unification.
near-account-id = { version = "3", features = ["abi"] }
borsh = "1"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
