[package]
name = "pac-token"
version = "0.1.0"
edition = "2021"
description = "PAC memecoin — minimal NEP-141 fungible token (one deployed per launched coin)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5"
near-contract-standards = "5.5"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
